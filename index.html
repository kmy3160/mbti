<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>성격으로 알아보는 나의 소울 디저트</title>
    <style>
        :root {
            --primary-color: #00C8C8;
            --primary-hover: #00b3b3;
            --bg-color: #f7f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --gray-text: #666666;
            --light-gray: #f0f2f5;
            --border-color: #e4e7eb;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        #app {
            width: 100%;
            max-width: 480px;
            height: 100vh;
            max-height: 850px;
            background-color: var(--card-bg);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        @media (max-width: 480px) {
            #app {
                height: 100vh;
                max-height: none;
                border-radius: 0;
                box-shadow: none;
            }
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 30px;
            text-align: center;
            animation: fadeIn 0.4s ease-in-out;
            overflow-y: auto;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 공통 버튼 스타일 */
        .btn {
            width: 100%;
            max-width: 340px;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background-color: var(--primary-color);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            margin-top: 15px;
            box-shadow: 0 4px 12px rgba(0, 200, 200, 0.25);
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-outline {
            background-color: white;
            color: var(--primary-color);
            border: 2px solid var(--primary-color);
            box-shadow: none;
        }

        .btn-outline:hover {
            background-color: #f0fdfd;
        }

        /* 시작 화면 */
        .start-title {
            font-size: 26px;
            font-weight: 800;
            color: #222;
            margin-bottom: 15px;
            line-height: 1.3;
        }

        .start-desc {
            font-size: 15px;
            color: var(--gray-text);
            margin-bottom: 35px;
            line-height: 1.6;
            word-break: keep-all;
        }

        .start-emoji {
            font-size: 64px;
            margin-bottom: 20px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* 질문 화면 */
        .top-bar {
            width: 100%;
            max-width: 340px;
            margin-bottom: 30px;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background-color: var(--light-gray);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 10px;
        }

        .progress-bar {
            height: 100%;
            background-color: var(--primary-color);
            width: 0%;
            transition: width 0.3s ease;
            border-radius: 4px;
        }

        .progress-text {
            font-size: 13px;
            color: var(--gray-text);
            font-weight: 600;
            text-align: right;
        }

        .question-box {
            font-size: 20px;
            font-weight: 700;
            color: #222;
            margin-bottom: 30px;
            line-height: 1.4;
            word-break: keep-all;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .answer-btn {
            background-color: white;
            color: var(--text-color);
            border: 2px solid var(--border-color);
            box-shadow: none;
            font-weight: 600;
            margin: 10px 0;
            padding: 18px 20px;
            text-align: center;
            border-radius: 14px;
            transition: all 0.2s;
            word-break: keep-all;
        }

        .answer-btn:hover {
            border-color: var(--primary-color);
            background-color: #f0fdfd;
            color: var(--primary-color);
        }

        /* 결과 화면 */
        .result-emoji {
            font-size: 72px;
            margin-bottom: 10px;
        }

        .result-subtitle {
            font-size: 14px;
            font-weight: 700;
            color: var(--primary-color);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .result-title {
            font-size: 26px;
            font-weight: 800;
            color: #222;
            margin-bottom: 20px;
        }

        .result-desc-box {
            background-color: var(--light-gray);
            border-radius: 14px;
            padding: 20px;
            font-size: 15px;
            color: var(--gray-text);
            line-height: 1.6;
            margin-bottom: 25px;
            width: 100%;
            max-width: 340px;
            text-align: left;
            word-break: keep-all;
        }

        .result-buttons {
            width: 100%;
            max-width: 340px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .result-buttons .btn {
            margin: 0;
        }
    </style>
</head>
<body>

<div id="app">
    <!-- 1. 시작 화면 -->
    <div id="start-screen" class="screen active">
        <div class="start-emoji">🧁</div>
        <div class="start-title">성격으로 알아보는<br>나의 소울 디저트</div>
        <div class="start-desc">나의 평소 성향과 취향을 바탕으로<br>나와 가장 잘 어울리는 소울 디저트를 찾아보세요!</div>
        <button class="btn" onclick="startTest()">테스트 시작하기</button>
    </div>

    <!-- 2. 질문 화면 -->
    <div id="question-screen" class="screen">
        <div class="top-bar">
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
            <div id="progress-text" class="progress-text">1 / 16</div>
        </div>
        <div id="question-box" class="question-box">질문 내용이 들어갑니다.</div>
        <div style="width: 100%; max-width: 340px;">
            <button class="btn answer-btn" id="btn-a" onclick="handleAnswer('A')">선택지 A</button>
            <button class="btn answer-btn" id="btn-b" onclick="handleAnswer('B')">선택지 B</button>
        </div>
    </div>

    <!-- 3. 결과 화면 -->
    <div id="result-screen" class="screen">
        <div class="result-emoji" id="result-emoji">🧁</div>
        <div class="result-subtitle" id="result-mbti">ESTP</div>
        <div class="result-title" id="result-title">디저트 이름</div>
        <div class="result-desc-box" id="result-desc">
            디저트 설명이 여기에 표시됩니다.
        </div>
        <div class="result-buttons">
            <button class="btn" onclick="copyUrl()">결과 공유하기 (링크 복사)</button>
            <button class="btn btn-outline" onclick="restartTest()">다시 하기</button>
        </div>
    </div>
</div>

<script>
    // 총 16문항 데이터 (각 지표별 4문항)
    const questions = [
        // E / I (4문항)
        { q: "주말 오후, 약속이 없는 날 나의 선택은?", a: { text: "친구들을 불러 모아 핫플 투어나 약속을 잡는다.", type: "E" }, b: { text: "집에서 넷플릭스를 보며 완벽한 혼자만의 휴식을 즐긴다.", type: "I" } },
        { q: "사람이 많은 북적이는 파티나 모임에 참석했을 때 나는?", a: { text: "새로운 사람들과 쉽게 대화하며 에너지를 얻는다.", type: "E" }, b: { text: "아는 사람들과 조용히 대화하거나 기가 빨려 집에 가고 싶어 한다.", type: "I" } },
        { q: "모르는 번호로 전화가 걸려왔을 때 나의 반응은?", a: { text: "일단 받아서 용건이 무엇인지 확인한다.", type: "E" }, b: { text: "안 받고 문자로 '누구세요?'라고 물어보거나 검색해본다.", type: "I" } },
        { q: "새로운 동아리나 모임에 처음 나갔을 때 나는?", a: { text: "먼저 다가가 말을 걸며 분위기를 주도한다.", type: "E" }, b: { text: "주변 상황을 살피며 누군가 말을 걸어주길 기다린다.", type: "I" } },

        // S / N (4문항)
        { q: "영화를 볼 때 나는 어떤 스타일에 더 끌리는가?", a: { text: "실화 바탕의 다큐멘터리나 현실적인 드라마", type: "S" }, b: { text: "상상력을 자극하는 판타지, SF, 마블 영화", type: "N" } },
        { q: "상대방이 길을 설명해 줄 때 선호하는 방식은?", a: { text: "'저기 사거리에서 우측으로 50m 가서 편의점 끼고 돌기'", type: "S" }, b: { text: "'저기 저 커다란 파란색 건물 지나서 느낌적인 느낌으로 쭉!'", type: "N" } },
        { q: "새로운 아이디어를 구상할 때 나의 접근 방식은?", a: { text: "현실적으로 당장 구현 가능하고 검증된 방법부터 찾는다.", type: "S" }, b: { text: "일단 엉뚱하고 거대한 상상부터 펼쳐본다.", type: "N" } },
        { q: "무엇인가를 배울 때 나는?", a: { text: "구체적인 매뉴얼과 예시를 보며 차근차근 익힌다.", type: "S" }, b: { text: "전체적인 흐름과 직관적 원리부터 이해하려 한다.", type: "N" } },

        // T / F (4문항)
        { q: "친구가 '나 오늘 너무 우울해서 속상해'라고 할 때?", a: { text: "'무슨 일인데? 왜 우울한지 원인을 파악해 보자.'", type: "T" }, b: { text: "'헐 무슨 일이야ㅠㅠ 많이 속상했겠다 안아줄까?'", type: "F" } },
        { q: "중요한 결정을 내려야 할 때 우선순위는?", a: { text: "객관적인 득실과 논리적인 타당성", type: "T" }, b: { text: "주위 사람들의 감정과 나와의 관계", type: "F" } },
        { q: "토론이나 논쟁이 붙었을 때 나의 모습은?", a: { text: "팩트와 논리로 상대방의 오류를 조목조목 짚어준다.", type: "T" }, b: { text: "상대방의 기분이 상하지 않도록 부드럽게 의견을 수용한다.", type: "F" } },
        { q: "맛집에 갔는데 맛이 별로였다면 계산할 때 나는?", a: { text: "음식의 완성도가 아쉬웠던 점을 객관적으로 생각한다.", type: "T" }, b: { text: "사장님이 장사하시느라 힘들 수도 있겠지 하며 넘어간다.", type: "F" } },

        // J / P (4문항)
        { q: "여행을 갈 때 나의 스타일은?", a: { text: "분 단위로 일정과 맛집 동선을 완벽하게 짜놓는다.", type: "J" }, b: { text: "숙소만 잡고 나머지는 그날 발길 닿는 대로 움직인다.", type: "P" } },
        { q: "주말 계획을 세울 때 나는?", a: { text: "해야 할 일 리스트를 만들고 순서대로 처리한다.", type: "J" }, b: { text: "일단 누워있다가 마음 내키는 대로 즉흥적으로 행동한다.", type: "P" } },
        { q: "책상이나 방 안의 상태를 표현한다면?", a: { text: "물건마다 제자리가 있고 깔끔하게 정리되어 있다.", type: "J" }, b: { text: "어지러워 보여도 내 기준에선 어디에 뭐가 있는지 다 안다.", type: "P" } },
        { q: "마감일이 있는 과제나 업무를 마주했을 때?", a: { text: "미리미조 여유 있게 나누어서 끝마친다.", type: "J" }, b: { text: "마감 직전의 극 극대노 집중력을 발휘해 해낸다.", type: "P" } }
    ];

    // 16가지 MBTI 결과 데이터
    const resultsData = {
        "ISTJ": { emoji: "🧋", title: "클래식 밀크티", desc: "철저하고 신중하며 언제나 원칙을 지키는 듬직한 스타일입니다. 묵묵히 자신의 자리를 지키며 깊고 진한 신뢰감을 줍니다." },
        "ISFJ": { emoji: "🍠", title: "따뜻한 꿀고구마", desc: "주변 사람들을 세심하게 챙겨주는 다정한 수호자입니다. 겉보기엔 소박하지만 속은 누구보다 알차고 따뜻한 온기로 가득합니다." },
        "INFJ": { emoji: "🍵", title: "그린티 라떼", desc: "깊은 통찰력과 따뜻한 감성을 동시에 지닌 이상주의자입니다. 조용하지만 내면의 신념이 단단하고 몽환적인 분위기를 풍깁니다." },
        "INTJ": { emoji: "🍫", title: "진한 다크 초콜릿", desc: "냉철하고 분석적인 완벽주의 전략가입니다. 쌉싸름하면서도 깊고 진한 맛처럼, 복잡한 문제도 논리적으로 척척 해결해 냅니다." },
        "ISTP": { emoji: "🧊", title: "시원한 아이스 아메리카노", desc: "쓸데없는 감정 소모를 싫어하는 쿨한 마이웨이입니다. 군더더기 없이 깔끔하고 효율적인 처리를 자랑하는 현실적인 실용가입니다." },
        "ISFP": { emoji: "🍡", title: "말랑말랑 찹쌀모찌", desc: "부드럽고 유연하며 예술적 감각이 뛰어난 성향입니다. 겉은 말랑하지만 은근한 고집과 자신만의 확실한 취향을 가지고 있습니다." },
        "INFP": { emoji: "🦄", title: "몽환적인 마시멜로우", desc: "상상력이 풍부하고 감수성이 폭발하는 평화주의자입니다. 세상 모든 아름다운 것들을 사랑하며 나만의 세계에 깊이 빠져들곤 합니다." },
        "INTP": { emoji: "🧪", title: "톡톡 튀는 소다 젤리", desc: "끊임없는 호기심과 독창적인 아이디어를 품고 있는 사색가입니다. 세상의 원리를 탐구하고 분석하는 것을 즐깁니다." },
        "ESTJ": { emoji: "🥨", title: "바삭한 프레첼", desc: "체계적이고 효율적인 일처리를 추구하는 리더십 있는 관리자입니다. 똑 부러지는 성격으로 주변을 깔끔하게 정돈합니다." },
        "ESFJ": { emoji: "🧁", title: "달콤한 컵케이크", desc: "사람들을 만나고 어울리는 것을 좋아하는 분위기 메이커입니다. 다정다감하며 주변 사람들에게 늘 밝은 에너지를 전달합니다." },
        "ENFJ": { emoji: "🍯", title: "달고나 라떼", desc: "타인의 감정에 깊이 공감하고 영감을 불어넣어 주는 따뜻한 리더입니다. 모두가 조화롭게 어울릴 수 있도록 부드럽게 이끕니다." },
        "ENTJ": { emoji: "☕", title: "진한 에스프레소", desc: "대담하고 결단력 있게 목표를 향해 질주하는 개척자입니다. 탁월한 통솔력으로 언제나 판을 주도하고 성공을 이끌어냅니다." },
        "ESTP": { emoji: "🍬", title: "짜릿한 팝핑캔디", desc: "언제 어디서나 에너지가 넘치고 스릴을 즐기는 모험가입니다. 즉흥적이고 시원시원한 매력으로 주변을 지루할 틈 없게 만듭니다." },
        "ESFP": { emoji: "🍓", title: "상큼발랄 딸기 케이크", desc: "주목받는 것을 즐기는 파티의 주인공이자 인간 비타민입니다. 화려하고 유쾌한 매력으로 언제나 즐거운 분위기를 만듭니다." },
        "ENFP": { emoji: "🥤", title: "톡 쏘는 탄산 스무디", desc: "자유롭고 창의적인 에너지가 넘치는 열정적인 스파크입니다. 끊임없는 아이디어와 긍정적인 마인드로 주변을 환하게 밝힙니다." },
        "ENTP": { emoji: "🍋", title: "상큼 쌉싸름 레몬에이드", desc: "재치 넘치는 입담과 기발한 아이디어를 가진 혁신가입니다. 틀에 박힌 것을 거부하고 늘 새로운 도전을 즐깁니다." }
    };

    let currentIndex = 0;
    let scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };

    function startTest() {
        currentIndex = 0;
        scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0 };
        showScreen('question-screen');
        updateQuestion();
    }

    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(screenId).classList.add('active');
    }

    function updateQuestion() {
        if (currentIndex >= questions.length) {
            showResult();
            return;
        }

        const q = questions[currentIndex];
        document.getElementById('question-box').innerText = q.q;
        document.getElementById('btn-a').innerText = q.a.text;
        document.getElementById('btn-b').innerText = q.b.text;

        // 진행률 업데이트
        const progress = ((currentIndex) / questions.length) * 100;
        document.getElementById('progress-bar').style.width = progress + '%';
        document.getElementById('progress-text').innerText = `${currentIndex + 1} / ${questions.length}`;
    }

    function handleAnswer(choice) {
        const q = questions[currentIndex];
        const selectedType = choice === 'A' ? q.a.type : q.b.type;
        scores[selectedType]++;

        currentIndex++;
        updateQuestion();
    }

    function showResult() {
        let mbti = "";
        mbti += scores.E >= scores.I ? "E" : "I";
        mbti += scores.S >= scores.N ? "S" : "N";
        mbti += scores.T >= scores.F ? "T" : "F";
        mbti += scores.J >= scores.P ? "J" : "P";

        const result = resultsData[mbti] || resultsData["ESTP"];

        document.getElementById('result-emoji').innerText = result.emoji;
        document.getElementById('result-mbti').innerText = mbti;
        document.getElementById('result-title').innerText = result.title;
        document.getElementById('result-desc').innerText = result.desc;

        showScreen('result-screen');
    }

    function copyUrl() {
        const url = window.location.href;
        navigator.clipboard.writeText(url).then(() => {
            alert("테스트 링크가 복사되었습니다! 친구들에게 공유해보세요.");
        }).catch(() => {
            prompt("링크를 복사해주세요:", url);
        });
    }

    function restartTest() {
        startTest();
    }
</script>

</body>
</html>
